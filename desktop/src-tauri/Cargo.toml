[package]
name = "dubvi"
version = "0.1.0"
description = "Dub VI desktop shell"
authors = ["Dub VI"]
edition = "2021"

[lib]
name = "dubvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Manager::path() is available on AppHandle by default in Tauri 2
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
